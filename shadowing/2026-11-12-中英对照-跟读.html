"are", ""], [" ", ""], ["usually", "usual"], [" ", ""], ["uncertain", "uncertain"], [".", ""]]}, {"part": "B", "en": "Reading, exercise, learning, skills, trying things, making money — they all share one feature: while you're doing them, you see almost no progress. You have to keep at it for a long stretch before one day you suddenly realise you've changed. So what do we actually do to keep from giving up during that unbearable stretch? First: go back to why you started, and let yourself feel the sting again. When you're ready to quit, replay the specifics of the things that once cut deep. Not to wallow in the pain, but to remind yourself why you set out. Those bullet-like words from other people, those fiery looks, those nights you questioned what your life was for, that grinding sense of finding no way out — those experiences carry more force than any lecture. Human strength of spirit is born, in fact, in the struggle with pain. In the face of real pain, any pep talk, any piece of wisdom, looks pale. When you feel you can't go on, don't sink into the feeling and don't go looking for comfort. Try to find your way back to why you started, and let it relight your drive.", "cn": "读书、运动、学习、技能、尝试、赚钱，这些事有个共同特点：就是你执行的时候几乎看不到任何进展，你要坚持很长一段时间，才会在某天惊觉地发现自己变好了。那我们到底怎么做，才能在这段难熬的时期里不放弃呢？第一，回望初心，感念软弱。想放弃时，把曾深深打击过你的那些事的具体细节回忆一遍。不是要让自己沉浸在痛苦里，而是为了警醒自己为何出发。别人那些子弹般的言语、火焰般的目光，你那些质疑生命意义的每个夜晚，迟迟找不到出路的煎熬——这些经历比任何说教都更有力量。人类的精神力量，其实就是在与痛苦斗争的过程中生发出来的。在真实的痛苦面前，任何鸡汤、任何道理都显得苍白无力。觉得坚持不下去的时候，别陷入情绪或寻求安慰，尝试找回初心，让它重新点燃你的行动力。", "tok": [["Reading", "read"], [",", ""], [" ", ""], ["exercise", "exercise"], [",", ""], [" ", ""], ["learning", "learn"], [",", ""], [" ", ""], ["skills", "skill"], [",", ""], [" ", ""], ["trying", "try"], [" ", ""], ["things", "things"], [",", ""], [" ", ""], ["making", "mak"], [" ", ""], ["money", "money"], [" ", ""], ["—", ""], [" ", ""], ["they", ""], [" ", ""], ["all", "all"], [" ", ""], ["share", "share"], [" ", ""], ["one", "one"], [" ", ""], ["feature", "feature"], [": with", "with"], [" ", ""], ["pain", "pain"], [".", ""], [" ", ""], ["In", "in"], [" ", ""], ["the", "the"], [" ", ""], ["face", "face"], [" ", ""], ["of", "of"], [" ", ""], ["real", "real"], [" ", ""], ["pain", "pain"], [",", ""], [" ", ""], ["any", "any"], [" ", ""], ["pep", "pep"], [" ", ""], ["talk", "talk"], [",", ""], [" ", ""], ["any", "any"], [" ", ""], ["piece", "piece"], [" ", ""], ["of", "of"], [" ", ""], ["wisdom", "wisdom"], [",", ""], [" ", ""], ["looks", "look"], [" ", ""], ["pale", "pale"], [".", ""], [" ", ""], ["When", "when"], [" ", ""], ["you", ""], [" ", ""], ["feel", "feel"], [" ", ""], ["you", ""], [" ", ""], ["can't", "can't"], [" ", ""], ["go", "go"], [" ", ""], ["on", "on"], [",", ""], [" ", ""], ["don't", "don't"], [" ", ""], ["sink", "sink"], [" ", ""], ["into", "into"], [" ", ""], ["the", "the"], [" ", ""], ["feeling", "feel"], [" ", ""], ["and", "and"], [" ", ""], ["don't", "don't"], [" ", ""], ["go", "go"], [" ", ""], ["looking", "look"], [" ", ""], ["for", "for"], [" ", ""], ["comfort", "comfort"], [".", ""], [" ", ""], ["Try", "try"], [" ", ""], ["to", "to"], [" ", ""], ["find", "find"], [" ", ""], ["your", ""], [" ", ""], ["way", "way"], [" ", ""], ["back", ""], [" ", ""], ["to", "to"], [" ", ""], ["why", "why"], [" ", ""], ["you", ""], [" ", ""], ["started", "start"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["let", "let"], [" ", ""], ["it", ""], [" ", ""], ["relight", "relight"], [" ", ""], ["your", ""], [" ", ""], ["drive", "drive"], [".", ""]]}, {"part": "B", "en": "Second: take your eyes off the result and focus only on today's actions. Most people can't stick with something — not because they lack willpower, but because they keep staring at the finish line. Every day they don't ask what they should do today; they ask how far they still are from the goal. That mindset makes each day's effort look trivial, makes you feel like you're standing still, and eventually drains your motivation completely. People who actually execute never look at the finish line. They look at today. Did I read the pages I was supposed to read today? Did I do the practice I was supposed to do today? Did I finish the task I was supposed to finish today? You're responsible for each today — not for that distant result. What we call a result is just the accumulation of countless todays. Do each today, each present moment, well, and the result becomes something that happens on its own.", "cn": "第二，把目光从结果上移开，只专注每天的动作。大多数人坚持不了一件事，根本原因不是意志力欠缺，而是他一直盯着终点看。每天想的不是今天该做什么，而是我离目标还有多远。这种心态会让你觉得每天的努力都微不足道，觉得自己一直在原地踏步，进而彻底丧失动力。但真正有执行力的人从来不看终点，他只关注今天。今天该读的书读了没有，今天该做的练习做了没有，今天该完成的任务完成了没有。你只需对每个今天负责，而不是对那个遥远的结果负责。所谓的结果，不过是无数个今天的累积。你把每个今天、每个当下做好，结果就是个自然而然发生的事情。", "tok": [["Second", "second"], [":", ""], [" ", ""], ["take", "take"], [" ", ""], ["your", ""], [" ", ""], ["eyes", "eyes"], [" ", ""], ["off", "off"], [" ", ""], ["the", "the"], [" ", ""], ["result", "result"], [" ", ""], ["and", "and"], [" ", ""], ["focus", "focus"], [" ", ""], ["only", "only"], [" ", ""], ["on", "on"], [" ", ""], ["today's", "today"], [" ", ""], ["actions", "action"], [".", ""], [" ", ""], ["Most", "most"], [" ", ""], ["people", "people"], [" ", ""], ["can't", "can't"], [" ", ""], ["stick", "stick"], [" ", ""], ["with", "with"], [" ", ""], ["something", "something"], [" ", ""], ["—", ""], [" ", ""], ["not", "not"], [" ", ""], ["because", "because"], [" ", ""], ["they", ""], [" ", ""], ["lack", "lack"], [" ", ""], ["willpower", "willpower"], [",", ""], [" ", ""], ["but", "but"], [" ", ""], ["because", "because"], [" ", ""], ["they", ""], [" ", ""], ["keep", "keep"], [" ", ""], ["staring", "star"], [" ", ""], ["at", "at"], [" ", ""], ["the", "the"], [" ", ""], ["finish", "finish"], [" ", ""], ["line", "line"], [".", ""], [" ", ""], ["Every", ""], [" ", ""], ["day", "day"], [" ", ""], ["they", ""], [" ", ""], ["don't", "don't"], [" ", ""], ["ask", "ask"], [" ", ""], ["what", "what"], [" ", ""], ["they", ""], [" ", ""], ["should", "should"], [" ", ""], ["d lve don't wait to feel ready. On a bad day they still clear the basic workload: good day, do a little more; bad day, do the bare minimum — but never stop. Expecting to feel fired up and full of zeal every single day isn't realistic. But taking that one small step when you least want to move can break a stalled state completely. In the end, execution isn't a talent some people have and others don't. It's the ability to stay calm through a long stretch with no feedback. When a seed is in the ground, you can't see anything above the surface — but its roots are quietly spreading. No visible change doesn't mean no change is happening. It just hasn't broken through yet. After all, you can't wait until you see hope to keep going. Only by keeping going can you possibly see it.", "cn": "第三，降低对状态的依赖。很多人有个坏习惯，就是只在状态好时才愿意行动。心情好就多干一点，情绪低落就不想做，干脆不干。但要知道，等状态变好，其实是在把人生主动权交给运气，交给我们每天变换不定的情绪感受。愿力够强的人不会等状态好了才开始。他在没状态时也能完成基本工作量：状态好就多做一点，状态差就做最低限度的事，但绝不停下来。指望每天充满斗志、热血沸腾并不现实。而在最不想动的时候，依然迈出那一小步，就可以彻底改变停滞的状态。说到底，执行力不是别人有、我没有的天赋，而是一种在漫长的无反馈期中找到安宁的能力。种子埋在土里时，地面上什么都看不到，但它的根在悄悄发展。看不到变化不代表变化没发生，只是还没有到破土而出的那天。毕竟人不能因为看到了希望才坚持，只有坚持了才可能看得到希望。", "tok": [["Third", "third"], [":", ""], [" ", ""], ["depend", "depend"], [" ", ""], ["less", "less"], [" ", ""], ["on", "on"], [" ", ""], ["your", ""], [" ", ""], ["state", "state"], [" ", ""], ["of", "of"], [" ", ""], ["mind", "mind"], [".", ""], [" ", ""], ["A", "a"], [" ", ""], ["lot", "lot"], [" ", ""], ["of", "of"], [" ", ""], ["people", "people"], [" ", ""], ["have", ""], [" ", ""], ["a", "a"], [" ", ""], ["bad", "bad"], [" ", ""], ["habit", "habit"], [" ", ""], ["—", ""], [" ", ""], ["they", ""], [" ", ""], ["only", "only"], [" ", ""], ["act", "act"], [" ", ""], ["when", "when"], [" ", ""], ["they", ""], [" ", ""], ["feel", "feel"], [" ", ""], ["good", "good"], [".", ""], [" ", ""], ["Good", "good"], [" ", ""], ["mood", "mood"], [",", ""], [" ", ""], ["they", ""], [" ", ""], ["do", ""], [" ", ""], ["a", "a"], [" ", ""], ["bit", "bit"], [" ", ""], ["mor ound"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["can't", "can't"], [" ", ""], ["see", "see"], [" ", ""], ["anything", "anything"], [" ", ""], ["above", "above"], [" ", ""], ["the", "the"], [" ", ""], ["surface", "surface"], [" ", ""], ["—", ""], [" ", ""], ["but", "but"], [" ", ""], ["its", ""], [" ", ""], ["roots", "root"], [" ", ""], ["are", ""], [" ", ""], ["quietly", "quiet"], [" ", ""], ["spreading", "spread"], [".", ""], [" ", ""], ["No", "no"], [" ", ""], ["visible", "visible"], [" ", ""], ["change", "change"], [" ", ""], ["doesn't", "doesn't"], [" ", ""], ["mean", "mean"], [" ", ""], ["no", "no"], [" ", ""], ["change", "change"], [" ", ""], ["is", ""], [" ", ""], ["happening", "happen"], [".", ""], [" ", ""], ["It", ""], [" ", ""], ["just", "just"], [" ", ""], ["hasn't", "hasn't"], [" ", ""], ["broken", "break"], [" ", ""], ["through", ""], [" ", ""], ["yet", ""], [".", ""], [" ", ""], ["After", ""], [" ", ""], ["all", "all"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["can't", "can't"], [" ", ""], ["wait", "wait"], [" ", ""], ["until", "until"], [" ", ""], ["you", ""], [" ", ""], ["see", "see"], [" ", ""], ["hope", "hope"], [" ", ""], ["to", "to"], [" ", ""], ["keep", "keep"], [" ", ""], ["going", "go"], [".", ""], [" ", ""], ["Only", "only"], [" ", ""], ["by", "by"], [" ", ""], ["keeping", "keep"], [" ", ""], ["going", "go"], [" ", ""], ["can", ""], [" ", ""], ["you", ""], [" ", ""], ["possibly", "possib"], [" ", ""], ["see", "see"], [" ", ""], ["it", ""], [".", ""]]}, {"part": "C", "en": "How do you keep your execution sharp on the days when you can't see any results — and still keep at one thing? You only need to remember one line from the Tao Te Ching: the bright road looks dim; the road that advances looks like it's going backwards. Humans are wired to crave instant feedback. Do something, and deep down you expect to see results right away. Short videos hand you pleasure instantly; games hand you a sense of achievement instantly. But the things that genuinely change your life have long payback periods — and the outcomes are usually uncertain. Reading, exercise, learning, skills, trying things, making money — they all share one feature: while you're doing them, you see almost no progress. You have to keep at it for a long stretch before one day you suddenly realise you've changed. So what do we actually do to keep from giving up during that unbearable stretch? First: go back to why you started, and let yourself feel the sting again. When you're ready to quit, replay the specifics of the things that once cut deep — not to wallow in the pain, but to remind yourself why you set out. Those bullet-like words from other people, those fiery looks, those nights you questioned what your life was for, that grinding sense of finding no way out: those experiences carry more force than any lecture. Human strength of spirit is born, in fact, in the struggle with pain. In the face of real pain, any pep talk, any piece of wisdom, looks pale.", "cn": "如何在那些看不到结果的日子里，依旧保持极高的执行力，坚持做一件事情呢？你只需要记住《道德经》里的这句话：明道若昧，进道若退——真正光明的道路看起来反而是灰暗的，真正前进的过程看起来反而像在后退。人是有追求及时反馈的本能的。做一件事，潜意识里总会希望立刻看到成果。刷短视频能立刻获得快感，打游戏能立刻获得成就感。但真正能改变你人生的事，回报周期都很长，而且结果往往是不确定的。读书、运动、学习、技能、尝试、赚钱，这些事有个共同特点：就是你执行的时候几乎看不到任何进展，你要坚持很长一段时间，才会在某天惊觉地发现自己变好了。那我们到底怎么做，才能在这段难熬的时期里不放弃呢？第一，回望初心，感念软弱。想放弃时，把曾深深打击过你的那些事的具体细节回忆一遍——不是要让自己沉浸在痛苦里，而是为了警醒自己为何出发。别人那些子弹般的言语、火焰般的目光，你那些质疑生命意义的每个夜晚，迟迟找不到出路的煎熬：这些经历比任何说教都更有力量。人类的精神力量，其实就是在与痛苦斗争的过程中生发出来的。在真实的痛苦面前，任何鸡汤、任何道理都显得苍白无力。", "tok": [["How", "how"], [" ", ""], ["do", ""], [" ", ""], ["you", ""], [" ", ""], ["keep", "keep"], [" ", ""], ["your", ""], [" ", ""], ["execution", "execution"], [" ", ""], ["sharp", "sharp"], [" ", ""], ["on", "on"], [" ", ""], ["the", "the"], [" ", ""], ["days", "days"], [" ", ""], ["when", "when"], [" ", ""], ["you", ""], [" ", ""], ["can't", "can't"], [" ", ""], ["see", "see"], [" ", ""], ["any", "any"], [" ", ""], ["results", "result"], [" ", ""], ["—", ""], [" ", ""], ["and", "and"], [" ", ""], ["still", " vation completely. People who actually execute never look at the finish line. They look at today. Did I read the pages I was supposed to read today? Did I do the practice I was supposed to do today? Did I finish the task I was supposed to finish today? You're responsible for each today — not for that distant result. What we call a result is just the accumulation of countless todays. Third: depend less on your state of mind. A lot of people have a bad habit — they only act when they feel good. Good mood, they do a bit more; low mood, they don't feel like it, so they just don't. But waiting to feel better is handing the steering wheel of your life to luck — to a mood that changes every day. People with real resolve don't wait to feel ready. On a bad day they still clear the basic workload: good day, do a little more; bad day, do the bare minimum — but never stop. Expecting to feel fired up and full of zeal every single day isn't realistic. But taking that one small step when you least want to move can break a stalled state completely. In the end, execution isn't a talent some people have and others don't. It's the ability to stay calm through a long stretch with no feedback. When a seed is in the ground, you can't see anything above the surface, but its roots are quietly spreading. No visible change doesn't mean no change is happening. It just hasn't broken through yet. After all, you can't wait until you see hope to keep going. Only by keeping going can you possibly see it.", "cn": "第二，把目光从结果上移开，只专注每天的动作。大多数人坚持不了一件事，根本原因不是意志力欠缺，而是他一直盯着终点看。每天想的不是今天该做什么，而是我离目标还有多远。这种心态会让你觉得每天的努力都微不足道，觉得自己一直在原地踏步，进而彻底丧失动力。但真正有执行力的人从来不看终点，他只关注今天。今天该读的书读了没有，今天该做的练习做了没有，今天该完成的任务完成了没有。你只需对每个今天负责，而不是对那个遥远的结果负责。所谓的结果，不过是无数个今天的累积。第三，降低对状态的依赖。很多人有个坏习惯，就是只在状态好时才愿意行动。心情好就多干一点，情绪低落就不想做，干脆不干。但要知道，等状态变好，其实是在把人生主动权交给运气，交给我们每天变换不定的情绪感受。愿力够强的人不会等状态好了才开始。他在没状态时也能完成基本工作量：状态好就多做一点，状态差就做最低限度的事，但绝不停下来。指望每天充满斗志、热血沸腾并不现实。而在最不想动的时候，依然迈出那一小步，就可以彻底改变停滞的状态。说到底，执行力不是别人有、我没有的天赋，而是一种在漫长的无反馈期中找到安宁的能力。种子埋在土里时，地面上什么都看不 const eng = {
  youdao: u => 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(u),
  google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
