", "value"], [".", ""]]}, {"part": "B", "en": "The single greatest source of a person's attractiveness comes down to four words: always able to walk away. When a woman can walk away from a man — when you can say to a man, okay, I'm done, I'm out of here — you then give that man the space he needs to gain clarity. Because sometimes access breeds blindness. We're blind to what we have access to.", "cn": "一个人最大的魅力来源，其实就四个字：随时能走。当一个女人能从一个男人身边走开时——当你能对一个男人说\"好了，我结束了，我走了\"——你才给了他需要的空间，让他看清。因为有时候，能轻易到手的东西会让人盲目。我们对唾手可得的人，是看不见的。", "tok": [["The", "the"], [" ", ""], ["single", "single"], [" ", ""], ["greatest", "greatest"], [" ", ""], ["source", "source"], [" ", ""], ["of", "of"], [" ", ""], ["a", "a"], [" ", ""], ["person's", "person"], [" ", ""], ["attractiveness", "attractiveness"], [" ", ""], ["comes", "come"], [" ", ""], ["down", "down"], [" ", ""], ["to", "to"], [" ", ""], ["four", "four"], [" ", ""], ["words", "word"], [":", ""], [" ", ""], ["always", "alway"], [" ", ""], ["able", "able"], [" ", ""], ["to", "to"], [" ", ""], ["walk", "walk"], [" ", ""], ["away", ""], [".", ""], [" ", ""], ["When", "when"], [" ", ""], ["a", "a"], [" ", ""], ["woman", "woman"], [" ", ""], ["can", ""], [" ", ""], ["walk", "walk"], [" ", ""], ["away", ""], [" ", ""], ["from", "from"], [" ", ""], ["a", "a"], [" ", ""], ["man", "man"], [" ", ""], ["—", ""], [" ", ""], ["when", "when"], [" ", ""], ["you", ""], [" ", ""], ["can", ""], [" ", ""], ["say", "say"], [" ", ""], ["to", "to"], [" ", ""], ["a", "a"], [" ", ""], ["man", "man"], [",", ""], [" ", ""], ["okay", "okay"], [",", ""], [" ", ""], ["I'm", "i'm"], [" ", ""], ["done", "do"], [",", ""], [" ", ""], ["I'm", "i'm"], [" ", ""], ["out", "out"], [" ", ""], ["of", "of"], [" ", ""], ["here", "here"], [" ", ""], ["—", ""], [" ", ""], ["you", ""], [" ", ""], ["then", "then"], [" ", ""], ["give", "give"], [" ", ""], ["that", "that"], [" ", ""], ["man", "man"], [" ", ""], ["the", "the"], [" ", ""], ["space", "space"], [" ", ""], ["he", ""], ["  willing to be loyal to. So he apologized and asked for another chance. And so when she came back, it didn't take me long. I said, we're getting married. I was very decisive, and I had made my mind up. But it was her walking away. That's the point that gave me the clarity that this woman is my life's partner. To this day, their marriage has lasted more than twenty years.", "cn": "后来 Lisa 交往了帅气多金的棒球球员。布莱克才幡然醒悟，觉得 Lisa 是自己的此生至爱，是他唯一愿意忠诚的女人，于是道歉求和。所以当她回来的时候，我没花多久就下了决心。我说：我们结婚吧。我非常果断，我已经下定了决心。但真正让我下定决心的，是她当初走了。就是那一刻让我看清：这个女人是我的人生伴侣。直到今天，他们的婚姻已经持续了 20 多年。", "tok": [["Lisa", "lisa"], [" ", ""], ["went", "go"], [" ", ""], ["on", "on"], [" ", ""], ["to", "to"], [" ", ""], ["date", "date"], [" ", ""], ["a", "a"], [" ", ""], ["handsome", "handsome"], [",", ""], [" ", ""], ["wealthy", "wealthy"], [" ", ""], ["baseball", "baseball"], [" ", ""], ["player", "player"], [".", ""], [" ", ""], ["Only", "only"], [" ", ""], ["then", "then"], [" ", ""], ["did", ""], [" ", ""], ["Blake", "blake"], [" ", ""], ["wake", "wake"], [" ", ""], ["up", "up"], [" ", ""], ["and", "and"], [" ", ""], ["decide", "decide"], [" ", ""], ["she", ""], [" ", ""], ["was", ""], [" ", ""], ["the", "the"], [" ", ""], ["love", "love"], [" ", ""], ["of", "of"], [" ", ""], ["his", ""], [" ", ""], ["life", "life"], [" ", ""], ["—", ""], [" ", ""], ["the", "the"], [" ", ""], ["only", "only"], [" ", ""], ["woman", "woman"], [" ", ""], ["he", ""], [" ", ""], ["was", ""], [" ", ""], ["willing", "wil"], [" ", ""], ["to", "to"], [" ", ""], ["be", ""], [" ", ""], ["loyal", "loyal"], [" ", ""], ["to", "to"], [".", ""], [" ", ""], ["So", "so"], [" ", ""], ["he", ""], [" ", ""], ["apologized", "apologize"], [" ", ""], ["and", "and"], [" ", ""], ["asked", "ask"], [" ", ""], ["for", "for"], [" ", ""], ["another", "another"], [" ", ""], ["chance", "chance"], [".", ""], [" ", ""], ["And", "and"], [" ", ""], ["so", "so"], [" ", ""], ["when", "when"], [" ", ""], ["she", ""], [" ", ""], ["came", "come"], [" ", ""], ["back", ""], ["  If he shakes his head, the waiter throws the whole cake in the bin, and neither of you gets anything. Now the knife is in your hand — you hold the power to allocate — and yet you don't dare cut too greedily. Cut yourself ninety percent, and he can decide you're screwing him over, flip the table and refuse. Then you both lose. So to keep any cake at all, you have to cut it more or less fairly — fifty-fifty, say. That's the ultimatum game.", "cn": "博弈论中有一个非常经典的实验，叫做最后通牒博弈。假如你和陌生人分一块蛋糕：你负责切，他负责选。你切好两块之后，问他这块给你行不行。他点头，你们就按这个分法吃；但只要他摇头，服务员就会立刻把整块蛋糕扔进垃圾桶，你们俩谁也别想吃。这个时候，虽然刀在你手里，你有分配权，但你却不敢切得太贪心。假如你给自己切 90%，对方觉得你太欺负人，他就有权利掀桌子拒绝，那结果就是双输。所以为了保住自己的蛋糕，你不得不切得相对公平，比如说五五开。这就是最后通牒博弈。", "tok": [["There", "there"], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["classic", "classic"], [" ", ""], ["experiment", "experiment"], [" ", ""], ["in", "in"], [" ", ""], ["game", "game"], [" ", ""], ["theory", "theory"], [" ", ""], ["called", "cal"], [" ", ""], ["the", "the"], [" ", ""], ["ultimatum", "ultimatum"], [" ", ""], ["game", "game"], [".", ""], [" ", ""], ["Say", "say"], [" ", ""], ["you're", "you're"], [" ", ""], ["splitting", "split"], [" ", ""], ["a", "a"], [" ", ""], ["cake", "cake"], [" ", ""], ["with", "with"], [" ", ""], ["a", "a"], [" ", ""], ["stranger", "stranger"], [":", ""], [" ", ""], ["you", ""], [" ", ""], ["cut", "cut"], [",", ""], [" ", ""], ["he", ""], [" ", ""], ["chooses", "choose"], [".", ""], [" ", ""], ["After", ""], [" ", ""], ["you", ""], [" ", ""], ["cut", "cut"], [" ", ""], ["two", "two"], [" ", ""], ["pieces", "piece"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["ask", "ask"], [" ", ""], ["him", ""], [" ", ""], ["whether", ""], [" ", ""], ["this", "this"], [" ", ""], ["one", "one"], [" ", ""], ["is", ""], [" ", ""], ["okay", "okay"], [".", ""], [" ", ""], ["If", "if"], [" ", ""], ["he", ""], [" ", ""], ["nods", "nods"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["both", ""], [" ", ""], ["eat", "eat"], [".", ""], [" ", ""], ["If", "if"], [" ford", "afford"], [" ", ""], ["to", "to"], [" ", ""], ["leave", "leave"], [",", ""], [" ", ""], ["fair", "fair"], [" ", ""], ["treatment", "treatment"], [" ", ""], ["rarely", "rare"], [" ", ""], ["comes", "come"], [".", ""]]}, {"part": "B", "en": "Balance in a relationship doesn't come from matching status, wealth and ability. It comes from both people having options. You can choose to love him, understand him, keep investing — or you can choose to leave once your boundaries are trampled, and stop playing. Constant appeasement never buys you being valued. It steadily lowers the price of hurting you. Once the other side confirms your bottom line is that you have none, no amount of visible pain will earn you real respect.", "cn": "关系中的平衡，不来自于两个人身份、财富和能力的完全相等，而来自于双方都拥有选择权。你可以选择爱他、理解他、继续投入，也可以选择在自己的边界被践踏后离开，不和他玩了。一味的示弱和退让不会换来珍惜。相反，它会不断降低对方伤害你的成本。当对方确认你的底线就是毫无底线时，你表达得再痛苦，也很难获得真正的尊重。", "tok": [["Balance", "balance"], [" ", ""], ["in", "in"], [" ", ""], ["a", "a"], [" ", ""], ["relationship", "relationship"], [" ", ""], ["doesn't", "doesn't"], [" ", ""], ["come", "come"], [" ", ""], ["from", "from"], [" ", ""], ["matching", "match"], [" ", ""], ["status", "status"], [",", ""], [" ", ""], ["wealth", "wealth"], [" ", ""], ["and", "and"], [" ", ""], ["ability", "ability"], [".", ""], [" ", ""], ["It", ""], [" ", ""], ["comes", "come"], [" ", ""], ["from", "from"], [" ", ""], ["both", ""], [" ", ""], ["people", "people"], [" ", ""], ["having", "have"], [" ", ""], ["options", "option"], [".", ""], [" ", ""], ["You", ""], [" ", ""], ["can", ""], [" ", ""], ["choose", "choose"], [" ", ""], ["to", "to"], [" ", ""], ["love", "love"], [" ", ""], ["him", ""], [",", ""], [" ", ""], ["understand", "understand"], [" ", ""], ["him", ""], [",", ""], [" ", ""], ["keep", "keep"], [" ", ""], ["investing", "invest"], [" ", ""], ["—", ""], [" ", ""], ["or", "or"], [" ", ""], ["you", ""], [" ", ""], ["can", ""], [" ", ""], ["choose", "choose"], [" ", ""], ["to", "to"], [" ", ""], ["leave", "lea nd let you believe they have finally seen the light — that the relationship really can restart. So you fall into a toxic nostalgia, endlessly replaying the best times between you. Those memories dilute and cover over the damage the relationship actually did. Strip it down: what you can't let go of isn't the person in front of you. It's the version of them you remember.", "cn": "坚定不移地离开，不是欲擒故纵。它代表你非常清楚自己想要什么、能接受什么。我知道有很多姐妹在关系中挣扎，明明已经意识到关系有毒，但就是离不开。但这也许并不是你的错。因为具有强烈自恋和操控倾向的伴侣，往往非常懂得怎么把你重新拉回深渊。心理学中把这种行为称作\"吸回\"。它会一直在你身边徘徊、试探，观察你的反应。它还会再次对你展开爱情轰炸，变成恋爱初期温柔体贴的样子，让你误以为它终于醒悟，关系真的能够重新开始。于是你会陷入一种有毒的怀旧，不停回忆你们之间最美好的时光。这些回忆冲淡、覆盖了关系中真实存在的创伤和痛苦。究其本质，你舍不得的根本就不是眼前这个人，而是你记忆中那个美好的他。", "tok": [["Leaving", "leav"], [" ", ""], ["and", "and"], [" ", ""], ["meaning", "mean"], [" ", ""], ["it", ""], [" ", ""], ["is", ""], [" ", ""], ["not", "not"], [" ", ""], ["a", "a"], [" ", ""], ["tactic", "tactic"], [" ", ""], ["to", "to"], [" ", ""], ["reel", "reel"], [" ", ""], ["someone", "someone"], [" ", ""], ["in", "in"], [".", ""], [" ", ""], ["It", ""], [" ", ""], ["says", "says"], [" ", ""], ["you", ""], [" ", ""], ["know", "know"], [" ", ""], ["exactly", "exact"], [" ", ""], ["what", "what"], [" ", ""], ["you", ""], [" ", ""], ["want", "want"], [" ", ""], ["and", "and"], [" ", ""], ["what", "what"], [" ", ""], ["you", ""], [" ", ""], ["will", "will"], [" ", ""], ["accept", "accept"], [".", ""], [" ", ""], ["I", ""], [" ", ""], ["know", "know"], [" ", ""], ["many", "many"], [" ", ""], ["women", "woman"], [" ", ""], ["struggle", "struggle"], [" ", ""], ["inside", "inside"], [" ", ""], ["relationships", "relationship"], [" ", ""], ["—", ""], [" ", ""], ["they", ""], [" ", ""], ["can", ""], [" ", ""], ["already", ""], [" ", ""], ["see", "see"], [" ", ""], ["it's", "it's"], [" ", ""], ["toxic", "toxic"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["still", "still"], [" ", ""], ["can't", "can't"], [" ", ""], ["get", "get"], [" ", ""], ["out", "out"], [".", ""], [" ", ""], ["That", "that"], [" to a bottomless pit of self-drain. Economic psychology has a vivid metaphor for this: the crocodile rule. Picture walking along when a hungry crocodile lunges out and clamps down on your foot. Anyone thinking clearly reacts the same way: give up the foot if you must, tear yourself free, and run. And what does someone trapped in the emotional version do? They don't run. They bend down and try to pry the crocodile's jaws open.", "cn": "千万不要试图通过沟通解决问题。你要明白，表达是下位者的需求，沉默是上位者的权利。当你还在试图跟那个伤害你的人要一个说法、试图掰扯清楚对错的时候，你其实已经掉进了一个无尽内耗的困局。经济心理学中有一个很形象的比喻，叫做鳄鱼法则。想象一下你正在走路，突然一只饥饿的鳄鱼窜了出来，死死咬住了你的脚。一个理智清醒的人，第一反应绝对是：哪怕舍弃这只脚，也要拼命挣脱，赶紧逃命。但陷入情绪陷阱的人会怎么做呢？他们不仅不跑，反而会弯下腰，伸手去掰鳄鱼的嘴。", "tok": [["Never", "never"], [" ", ""], ["try", "try"], [" ", ""], ["to", "to"], [" ", ""], ["fix", "fix"], [" ", ""], ["this", "this"], [" ", ""], ["through", ""], [" ", ""], ["communication", "communication"], [".", ""], [" ", ""], ["Understand", "understand"], [" ", ""], ["that", "that"], [" ", ""], ["speaking", "speak"], [" ", ""], ["up", "up"], [" ", ""], ["is", ""], [" ", ""], ["the", "the"], [" ", ""], ["need", "need"], [" ", ""], ["of", "of"], [" ", ""], ["the", "the"], [" ", ""], ["person", "person"], [" ", ""], ["with", "with"], [" ", ""], ["less", "less"], [" ", ""], ["power", "power"], [",", ""], [" ", ""], ["and", "and"], [" ", ""], ["silence", "silence"], [" ", ""], ["is", ""], [" ", ""], ["the", "the"], [" ", ""], ["privilege", "privilege"], [" ", ""], ["of", "of"], [" ", ""], ["the", "the"], [" ", ""], ["one", "one"], [" ", ""], ["with", "with"], [" ", ""], ["more", "more"], [".", ""], [" ", ""], ["The", "the"], [" ", ""], ["moment", "moment"], [" ", ""], ["you're", "you're"], [" ", ""], ["still", "still"], [" ", ""], ["asking", "ask"], [" ", ""], ["the", "the"], [" ", ""], ["person", "person"], [" ", ""], ["who", "who"], [" ", ""], ["hurt", "hurt"], [" ", ""], ["you", ""], [" ", ""], ["for", "for"], [" ", ""], ["an", "an"], [" ", ""], ["explanation", "explanation"], [",", ""], [" ", ""], ["still", "st percent, and he can decide you're screwing him over, flip the table and refuse. Then you both lose. So to keep any cake at all, you have to cut it more or less fairly — fifty-fifty, say. That's the ultimatum game. It exposes something brutally simple: refusal and walking away are a right. And fairness is usually forced into existence by the ability to flip the table. When someone has no standing to refuse and cannot afford to leave, fair treatment rarely comes.", "cn": "博弈论中有一个非常经典的实验，叫做最后通牒博弈。假如你和陌生人分一块蛋糕：你负责切，他负责选。你切好两块之后，问他这块给你行不行。他点头，你们就按这个分法吃；但只要他摇头，服务员就会立刻把整块蛋糕扔进垃圾桶，你们俩谁也别想吃。这个时候，虽然刀在你手里，你有分配权，但你却不敢切得太贪心。假如你给自己切 90%，对方觉得你太欺负人，他就有权利掀桌子拒绝，那结果就是双输。所以为了保住自己的蛋糕，你不得不切得相对公平，比如说五五开。这就是最后通牒博弈。它揭示了一个非常残酷的现实：拒绝和离开是一种权利。而公平往往是靠掀桌子的能力逼出来的。当一个人没有拒绝的资格，也承担不起离开的代价时，他很难得到公平对待。", "tok": [["There", "there"], [" ", ""], ["is", ""], [" ", ""], ["a", "a"], [" ", ""], ["classic", "classic"], [" ", ""], ["experiment", "experiment"], [" ", ""], ["in", "in"], [" ", ""], ["game", "game"], [" ", ""], ["theory", "theory"], [" ", ""], ["called", "cal"], [" ", ""], ["the", "the"], [" ", ""], ["ultimatum", "ultimatum"], [" ", ""], ["game", "game"], [".", ""], [" ", ""], ["Say", "say"], [" ", ""], ["you're", "you're"], [" ", ""], ["splitting", "split"], [" ", ""], ["a", "a"], [" ", ""], ["cake", "cake"], [" ", ""], ["with", "with"], [" ", ""], ["a", "a"], [" ", ""], ["stranger", "stranger"], [":", ""], [" ", ""], ["you", ""], [" ", ""], ["cut", "cut"], [",", ""], [" ", ""], ["he", ""], [" ", ""], ["chooses", "choose"], [".", ""], [" ", ""], ["After", ""], [" ", ""], ["you", ""], [" ", ""], ["cut", "cut"], [" ", ""], ["two", "two"], [" ", ""], ["pieces", "piece"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["ask", "ask"], [" ", ""], ["him", ""], [" ", ""], ["whether", ""], [" ", ""], ["this", "this"], [" ", ""], ["one", "one"], [" ", ""], ["is", ""], [" ", ""], ["okay", "okay"], [".", ""], [" ", ""], ["If", "if"], [" ", ""], ["he", ""], [" ", ""], ["nods", "nods"], [",", ""], [" ", ""], ["y : "", "defs": ["pron. 谁"], "forms": [], "ex": [], "lv": null}, "how": {"w": "how", "ph": "", "defs": ["adv. 怎样"], "forms": [], "ex": [], "lv": null}, "why": {"w": "why", "ph": "", "defs": ["adv. 为什么"], "forms": [], "ex": [], "lv": null}, "all": {"w": "all", "ph": "", "defs": ["adj./pron. 全部"], "forms": [], "ex": [], "lv": null}, "any": {"w": "any", "ph": "", "defs": ["adj./pron. 任何"], "forms": [], "ex": [], "lv": null}, "more": {"w": "more", "ph": "", "defs": ["adj./adv. 更多"], "forms": [], "ex": [], "lv": null}, "many": {"w": "many", "ph": "", "defs": ["adj. 许多（可数）"], "forms": [], "ex": [], "lv": null}, "will": {"w": "will", "ph": "", "defs": ["v./n. 将要；意志"], "forms": [], "ex": [], "lv": null}, "must": {"w": "must", "ph": "", "defs": ["v. 必须"], "forms": [], "ex": [], "lv": null}};
const eng = {
  youdao: u => 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(u),
  google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
