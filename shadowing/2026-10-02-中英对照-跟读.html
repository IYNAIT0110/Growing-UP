" ", ""], ["a", "a"], [" ", ""], ["long", "long"], [" ", ""], ["training", "train"], [".", ""]]}, {"part": "B", "en": "Real love never needs the sensation of falling from a cliff edge to prove itself. Still less does it need the other's cruelty as fuel for the engine of your own desire. Try to see through this desire-game you wrote and staged yourself. Stop the hands that keep trying to beg warmth from coldness. Learn to tell pathological self-esteem lashing back apart from a healthy living connection. Let loss happen, and let some people simply not belong to you. Only when you have utterly let go of your pathological attachment to lack and suspense, and learned to enjoy what is plain, steady and respected, can you truly step down from this self-deceiving emotional treadmill, and live out a true self that is clear-eyed, self-sufficient and genuinely warm.", "cn": "真正的爱，从来不需要依靠悬崖边缘的坠落感来证明，更不需要用对方的残忍来给自己的欲望机器当燃料。试着看破这场自导自演的欲望游戏，停下那双试图向冷漠乞求温度的手，学会区分病态的自尊反扑与健康的生命连接。允许失去发生，也允许有些人就是不属于你。唯有当你彻底放下了对匮乏与悬念的病态迷恋，学会享受平实、安定与被尊重时，你才能真正从这场自欺欺人的情感游戏中走下来，活出通透、自足且拥有真实温度的本真自我。", "tok": [["Real", "real"], [" ", ""], ["love", "love"], [" ", ""], ["never", "never"], [" ", ""], ["needs", "need"], [" ", ""], ["the", "the"], [" ", ""], ["sensation", "sensation"], [" ", ""], ["of", "of"], [" ", ""], ["falling", "fal"], [" ", ""], ["from", "from"], [" ", ""], ["a", "a"], [" ", ""], ["cliff", "cliff"], [" ", ""], ["edge", "edge"], [" ", ""], ["to", "to"], [" ", ""], ["prove", "prove"], [" ", ""], ["itself", "itself"], [".", ""], [" ", ""], ["Still", "still"], [" ", ""], ["less", "less"], [" ", ""], ["does", ""], [" ", ""], ["it", ""], [" ", ""], ["need", "need"], [" ", ""], ["the", "the"], [" ", ""], ["other's", "other"], [" ", ""], ["cruelty", "cruelty"], [" ", ""], ["as", "as"], [" ", ""], ["fuel", "fuel"], [" ", ""], ["for", "for"], [" ", ""], ["the", "the"], [" ", ""], ["engine", "engine"], [" ", ""], ["of", "of"], [" ", ""], ["your", ""], [" ", ""], ["own", "own"], [" ", ""], ["desire", " 顺、随时可得时，关系的确定性便填平了那个缺口。欲望失去了攀爬的支点，自然会走向枯竭与倦怠。而唯有当对方彻底抽离、冷落，重新拉开一道无法逾越的深渊时，那个得不到的客体，才会在潜意识中被骤然神化，爆发出近乎癫狂的吸引力。罗兰·巴特在《恋人絮语》中，更是洞穿了这种心理的荒谬本质。", "tok": [["Why", "why"], [" ", ""], ["do", ""], [" ", ""], ["some", "some"], [" ", ""], ["people", "people"], [" ", ""], ["only", "only"], [" ", ""], ["fall", "fall"], [" ", ""], ["into", "into"], [" ", ""], ["frantic", "frantic"], [" ", ""], ["infatuation", "infatuation"], [" ", ""], ["when", "when"], [" ", ""], ["they", ""], [" ", ""], ["are", ""], [" ", ""], ["utterly", "utter"], [" ", ""], ["frozen", "frozen"], [" ", ""], ["out", "out"], ["?", ""], [" ", ""], ["In", "in"], [" ", ""], ["his", ""], [" ", ""], ["dynamics", "dynamic"], [" ", ""], ["of", "of"], [" ", ""], ["desire", "desire"], [",", ""], [" ", ""], ["Lacan", "lacan"], [" ", ""], ["once", ""], [" ", ""], ["tore", "tore"], [" ", ""], ["away", ""], [" ", ""], ["the", "the"], [" ", ""], ["false", "false"], [" ", ""], ["mask", "mask"], [" ", ""], ["of", "of"], [" ", ""], ["this", "this"], [" ", ""], ["phenomenon", "phenomenon"], [".", ""], [" ", ""], ["The", "the"], [" ", ""], ["engine", "engine"], [" ", ""], ["that", "that"], [" ", ""], ["drives", "drif"], [" ", ""], ["human", "human"], [" ", ""], ["desire", "desire"], [" ", ""], ["has", ""], [" ", ""], ["never", "never"], [" ", ""], ["been", ""], [" ", ""], ["fullness", "fullness"], [" ", ""], ["—", ""], [" ", ""], ["it", ""], [" ", ""], ["is", ""], [" ", ""], ["lack", "lack"], [".", ""], [" ", ""], ["In", "in"], [" ", ""], ["Lacan's", "lacan"], [" ", ""], ["system", "system"], [",", ""], [" ", ""], ["desire", "desire"], [" ", ""], ["is", ""], [" ", ""], ["sustained", "sustain"], [" ", ""], ["only", "only"], [" ", ""], ["by", "by"], [" ", ""], ["an", "an"], [" ", ""], ["unmet", "unmet"], [" ", ""], ["gap", "gap"], [".", ""], [" ", ""], ["When", "when"], [" ", ""], ["someone", "someone"], [" ", ""], ["is", ""], [" ", ""], ["completely", "complete"], [" ", ""], ["compliant", "compliant"], [" ", ""], ["with", "with"], [ votion — that is an emotional dislocation the mind forms over a long training. Real love never needs the sensation of falling from a cliff edge to prove itself. Still less does it need the other's cruelty as fuel for the engine of your own desire. Try to see through this desire-game you wrote and staged yourself. Stop the hands that keep trying to beg warmth from coldness. Learn to tell pathological self-esteem lashing back apart from a healthy living connection. Let loss happen, and let some people simply not belong to you. Only when you have utterly let go of your pathological attachment to lack and suspense, and learned to enjoy what is plain, steady and respected, can you truly step down from this self-deceiving emotional treadmill, and live out a true self that is clear-eyed, self-sufficient and genuinely warm.", "cn": "当对方全心投入时，你感到索然无味，甚至感到窒息；而一旦对方收回所有的善意，将你彻底推向旁观者的位置，你内心深处的安全感便瞬间坍塌。你的大脑为了平息这份羞耻与挫败，迅速将不甘心重构为不可自拔的爱意。你疯狂心动的对象，从来不是那个冷漠的肉身，而是你那份急需通过重新征服来救赎的破碎自尊。你借着追逐的名义，试图抹平自己被忽视的耻辱。然而，看清心动的底层假象，不是为了对一切亲密关系心灰意冷，而是为了从匮乏驱动的受虐循环中彻底清醒。把失控当成激情，把冷落当成深情，是心智在漫长规训中形成的一种情感错位。真正的爱，从来不需要依靠悬崖边缘的坠落感来证明，更不需要用对方的残忍来给自己的欲望机器当燃料。试着看破这场自导自演的欲望游戏，停下那双试图向冷漠乞求温度的手，学会区分病态的自尊反扑与健康的生命连接。允许失去发生，也允许有些人就是不属于你。唯有当你彻底放下了对匮乏与悬念的病态迷恋，学会享受平实、安定与被尊重时，你才能真正从这场自欺欺人的情感游戏中走下来，活出通透、自足且拥有真实温度的本真自我。", "tok": [["When", "when"], [" ", ""], ["the", "the"], [" ", ""], ["other", "other"], [" ", ""], ["person", "person"], [" ", ""], ["throws", "throw"], [" ", ""], ["themselves", "themself"], [" ", ""], ["in", "in"], [" ", ""], ["wholeheartedly", "wholehearted"], [",", ""], [" ", ""], ["you", ""], [" ", ""], ["find", "find"], [" ", ""], ["it", ""], [" ", ""], ["insipid", "insipid"], [",", ""], [" ", ""], ["even", "even"], [" ", ""], ["suffocating", "suffocat"], [".", ""], [" ", ""], ["And", "and"], [" ", ""], ["the", "the"], [" ", ""], ["moment", "moment"], [" ", ""], ["they", ""], [" ", ""], ["withdraw", "withdraw"], [" ", ""], ["all", "all"], [" ", ""], ["their", ""], [" ", ""], ["goodwill", "goodwill"], [","   google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
