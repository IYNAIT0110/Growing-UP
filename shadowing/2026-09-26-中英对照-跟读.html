<style>
:root{
  --bg:#fbfaf8; --card:#fff; --line:#e6e2dc; --tx:#1f2328; --tx2:#6b7280; --tx3:#9ca3af;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
header{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.96);backdrop-filter:blur(8px);

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px}
button,select{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
label{display:flex;align-items:center;gap:5px;color:var(--tx2)}
input[type=range]{width:88px}
#status{font-size:12px;color:var(--tx2);margin-top:5px}
.wrap{display:flex;gap:16px;max-width:1400px;margin:0 auto;padding:16px 18px 60px;align-items:flex-start}
main{flex:1 1 auto;min-width:0}
aside{flex:0 0 40%;max-width:520px;position:sticky;top:118px;max-height:calc(100vh - 136px);

.part-h{margin:20px 0 9px;font-size:13px;font-weight:650;color:var(--accent)}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:.15s}
.row:hover{border-color:var(--accent)}
.row.playing{background:var(--soft);border-color:var(--accent)}
.row.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,111,79,.13)}
.en{font-size:15.5px}
.num{display:inline-block;min-width:30px;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums}
.cn{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:var(--cn);font-size:13px}
body.show-cn .cn{display:block}
.ph{font-size:12.5px;color:var(--tx2);margin:2px 0 10px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:4px;line-height:2;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:14.5px;cursor:pointer;
  background:#fdfdfc;transition:.12s}
.chip:hover{border-color:var(--accent);background:var(--soft)}
.chip.sel{background:var(--hl);border-color:#d9b648}
.chip.dict{border-bottom:2px solid #9ccbb0}
.punct{color:var(--tx3);font-size:14.5px}
.card{border-top:1px solid var(--line);padding-top:12px;min-height:130px}
.hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word{font-size:21px;font-weight:650}
.phn{color:var(--tx2);font-size:13px}
.badge{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--soft);
  color:var(--accent);border:1px solid #cfe3d7}
.badge.lv{background:#fdf0e3;color:var(--warn);border-color:#f0dcbc}
.defs{margin:6px 0 0;padding-left:18px;font-size:14px}
.defs li{margin-bottom:3px}
.forms{font-size:12px;color:var(--tx2);margin-top:8px}
.sub{margin-top:12px;font-size:12px;font-weight:650;color:var(--accent)}
.ex{border-left:2px solid #cfe3d7;padding:4px 0 4px 10px;margin:6px 0;font-size:13.5px;cursor:pointer}
.ex:hover{border-left-color:var(--accent)}
.ex .cnx{color:var(--cn);font-size:12.5px}
.empty{color:var(--tx3);font-size:13.5px;padding:18px 0}
.hint{font-size:12.5px;color:var(--tx2);background:#f2f4f3;border-radius:8px;
  padding:9px 12px;margin-bottom:12px;line-height:1.7}
.vocab{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.vocab ul{padding-left:16px;margin:6px 0 0;font-size:13px}
.vocab li{margin-bottom:2px}
.vw{cursor:pointer;font-weight:600}
.vw:hover{color:var(--accent)}
.del{color:#c0c4c9;cursor:pointer;margin-left:6px}
footer{max-width:1400px;margin:0 auto;padding:0 18px 30px;font-size:12px;color:var(--tx2)}
@media (max-width:1000px){
  .wrap{flex-direction:column}
  aside{flex:1 1 auto;width:100%;max-width:none;position:static;max-height:none}
}
</style>

const eng = {
  youdao: u => 'https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(u),
  google: u => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(u)
};
let voices = [], stopFlag = false, audioEl = null, curRow = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 句子列表 ---------- */
let h = '', last = '';
DATA.forEach((d, i) => {
  if (d.part !== last) { last = d.part; h += '<div class="part-h">Part ' + d.part + '</div>'; }
  h += '<div class="row" data-i="' + i + '"><div class="en"><span class="num">' + (i+1) + '</span>'
     + esc(d.en) + '</div>' + (d.cn ? '<div class="cn">' + esc(d.cn) + '</div>' : '') + '</div>';
});
$('list').innerHTML = h;

/* ---------- 语音 ---------- */
function loadVoices(){
  const sel = $('voice');
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">默认语音</option>'
    + voices.map((v,i) => '<option value="' + i + '">' + esc(v.name) + '</option>').join('');
  if (!voices.length){
    $('engine').value = 'youdao';
    $('status').innerHTML = '本机没有检测到英文语音包，已自动切到<b>在线·有道</b>（需要联网）。';
  } else {
    $('status').textContent = '检测到 ' + voices.length + ' 个英文语音，使用本地离线朗读。';
  }
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speakLocal(text, done){
  const u = new SpeechSynthesisUtterance(text);
  const idx = $('voice').value;
  if (idx !== '' && voices[idx]) u.voice = voices[idx];
  u.lang = 'en-US'; u.rate = parseFloat($('rate').value);
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
function splitChunks(text, max){
  const first = []; let cur = '';
  text.split(/(?<=[.;:!?])\s+|(?<=,)\s+/).forEach(seg => {
    if ((cur + ' ' + seg).trim().length > max && cur){ first.push(cur.trim()); cur = seg; }
    else cur = (cur ? cur + ' ' : '') + seg;
  });
  if (cur.trim()) first.push(cur.trim());
  const res = [];
  first.forEach(c => {
    if (c.length <= max){ res.push(c); return; }
    let buf = '';
    c.split(/\s+/).forEach(w => {
      if ((buf + ' ' + w).length > max && buf){ res.push(buf); buf = w; } else buf = buf ? buf + ' ' + w : w;
    });
    if (buf) res.push(buf);
  });
  return res;
}
function speakOnline(text, done){
  const mk = eng[$('engine').value] || eng.youdao;
  const arr = splitChunks(text, 170);
  let k = 0, fail = 0;
  (function next(){
    if (stopFlag || k >= arr.length) return done();
    if (audioEl) audioEl.pause();
    audioEl = new Audio(mk(arr[k])); k++;
    audioEl.onended = next;
    audioEl.onerror = () => { if (++fail >= 2) return done(); next(); };
    audioEl.play().catch(() => next());
  })();
}
function speak(text, done){
  if ($('engine').value === 'local' && voices.length) speakLocal(text, done);
  else speakOnline(text, done);
}

/* ---------- 生词本 ---------- */
const VKEY = 'yuedu_vocab';
let vocab = [];
try { vocab = JSON.parse(localStorage.getItem(VKEY) || '[]'); } catch(e){ vocab = []; }
function renderVocab(){
  $('vocabH').textContent = '⭐ 生词本（' + vocab.length + '）';
  const ul = $('vocab');
  ul.innerHTML = '';
  vocab.forEach((w, i) => {
    const li = document.createElement('li');
    const a = document.createElement('span');
    a.className = 'vw'; a.textContent = w;
    a.onclick = () => showWord(w, w);
    const b = document.createElement('span');
    b.className = 'del'; b.textContent = '×';
    b.onclick = () => { vocab.splice(i, 1); saveVocab(); };
    li.appendChild(a); li.appendChild(b); ul.appendChild(li);
  });
}
function saveVocab(){
  localStorage.setItem(VKEY, JSON.stringify(vocab));
  renderVocab();
}
renderVocab();

/* ---------- 词面板 ---------- */
function renderSentence(i){
  curRow = i;
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if (row) row.classList.add('active');
  const d = DATA[i];
  $('sent').innerHTML = '<b>句 ' + (i+1) + '</b>（Part ' + d.part + '）· ' + esc(d.en);
  const box = $('chips');
  box.innerHTML = '';
  (d.tok || []).forEach(p => {
    const t = p[0], k = p[1];
    if (/^\s+$/.test(t)){
      const sp = document.createElement('span'); sp.innerHTML = '&nbsp;'; box.appendChild(sp); return;
    }
    if (!/^[A-Za-z]/.test(t)){
      const sp = document.createElement('span'); sp.className = 'punct'; sp.textContent = t; box.appendChild(sp); return;
    }
    const el = document.createElement('span');
    el.className = 'chip' + (k && BANK[k] ? ' dict' : '');
    el.textContent = t;
    el.onclick = () => {
      box.querySelectorAll('.chip.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      showWord(k, t);
    };
    box.appendChild(el);
  });
  $('card').innerHTML = '<div class="empty">点上面任意单词查看释义。<br>带绿色底线的词，词库已收录。</div>';
}

function showWord(key, surface){
  const e = BANK[key];
  if (!e){
    $('card').innerHTML = '<div class="hd"><span class="word">' + esc(surface || key) + '</span></div>'
      + '<div class="empty">词库暂未收录这个词。</div>';
    return;
  }
  let html = '<div class="hd"><span class="word">' + esc(e.w) + '</span>'
           + (e.ph ? '<span class="phn">/' + esc(e.ph) + '/</span>' : '')
           + (e.lv ? '<span class="badge lv">' + esc(e.lv) + '</span>' : '')
           + '<button id="speakW">🔊 朗读</button><button id="starW">⭐</button></div>';
  if (e.defs && e.defs.length)
    html += '<div class="sub">释义</div><ul class="defs">' + e.defs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  if (e.forms && e.forms.length)
    html += '<div class="forms">词形变化：' + esc(e.forms.join(' ｜ ')) + '</div>';
  if (e.ex && e.ex.length){
    html += '<div class="sub">真实例句（点句朗读）</div>';
    html += e.ex.map(p => '<div class="ex" data-s="' + esc(p[0]) + '">' + esc(p[0])
             + '<div class="cnx">' + esc(p[1]) + '</div></div>').join('');
  }
  $('card').innerHTML = html;
  $('speakW').onclick = () => speak(e.w, () => {});
  const sw = $('starW');
  const sync = () => {
    const on = vocab.indexOf(e.w) >= 0;
    sw.textContent = on ? '★ 已收藏' : '⭐ 收藏';
    sw.className = on ? 'on' : '';
  };
  sw.onclick = () => {
    const i = vocab.indexOf(e.w);
    if (i >= 0) vocab.splice(i, 1); else vocab.push(e.w);
    saveVocab(); sync();
  };
  sync();
  $('card').querySelectorAll('.ex').forEach(el => {
    el.onclick = () => speak(el.dataset.s, () => {});
  });
}

/* ---------- 播放控制 ---------- */
function clearHL(){ document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing')); }
function highlight(i){
  clearHL();
  const el = document.querySelector('.row[data-i="' + i + '"]');
  if (el){ el.classList.add('playing'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}
function cancelAll(){
  stopFlag = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
async function playFrom(start){
  stopFlag = false;
  for (let i = start; i < DATA.length; i++){
    if (stopFlag) break;
    highlight(i); renderSentence(i);
    await new Promise(res => speak(DATA[i].en, res));
    if (stopFlag) break;
    await new Promise(res => setTimeout(res, +$('gap').value));
  }
  clearHL();
}
$('list').addEventListener('click', ev => {
  const row = ev.target.closest('.row');
  if (!row) return;
  cancelAll(); stopFlag = false;
  const i = +row.dataset.i;
  highlight(i); renderSentence(i);
  speak(DATA[i].en, () => {});
});
$('playAll').onclick = () => { cancelAll(); playFrom(0); };
$('stop').onclick = () => { cancelAll(); clearHL(); };
$('toggleCn').onclick = function(){
  document.body.classList.toggle('show-cn');
  this.classList.toggle('on');
  this.textContent = document.body.classList.contains('show-cn') ? '隐藏中文' : '显示中文';
};
$('rate').oninput = () => $('rateVal').textContent = $('rate').value + 'x';
$('gap').oninput = () => $('gapVal').textContent = ($('gap').value / 1000).toFixed(1) + 's';
$('engine').onchange = function(){
  if (this.value === 'local' && !voices.length){
    this.value = 'youdao';
    $('status').textContent = '本机没有英文语音包，无法使用本地模式。';
  } else {
    $('status').textContent = this.value === 'local'
      ? '已切换到本地离线朗读。' : '已切换到' + this.options[this.selectedIndex].text + '（需要联网）。';
  }
};
</script>
